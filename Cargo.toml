[package]
name = "kokoro-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
cpal = "0.18.1"
ctrlc = "3.5.2"
espeak-rs = "0.2.0"
flate2 = "1.1.9"
hound = "3.5.1"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-23"] }
tar = "0.4.46"
ureq = { version = "3.3.0", features = ["json"] }

[dev-dependencies]
serde_json = "1.0.151"
